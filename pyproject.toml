[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-agent"
version = "0.1.0"
description = "Evidence-aware parametric drawing agent and honest online evaluation"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "python-multipart>=0.0.9", "numpy>=1.24", "scipy>=1.10", "ezdxf>=1.3", "Pillow>=10", "opencv-python-headless>=4.9", "shapely>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
contour-agent = "contour_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["contour_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
